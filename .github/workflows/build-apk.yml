name: Build PotensicProxy TAF APK

on:
  push:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build debug APK for BL_ commit
    if: ${{ startsWith(github.event.head_commit.message, 'BL_') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Verify required map WebUI sources
        shell: bash
        run: |
          required=(
            webui/src/components/cockpit/MapView.vue
            webui/src/components/settings/MapSettingsView.vue
            webui/src/composables/useCockpitViewSettings.ts
            webui/src/services/MapService.ts
            webui/src/types/map.ts
          )
          missing=0
          for file in "${required[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=$file::Required map integration source file is missing from the commit/package."
              missing=1
            fi
          done
          exit "$missing"

      - name: Verify MiniPair protocol source completeness
        shell: bash
        run: |
          grep -q "fun buildFpvMiniPair" app/src/main/java/com/potensic/proxy/DroneProtocol.kt || {
            echo "::error file=app/src/main/java/com/potensic/proxy/DroneProtocol.kt::Missing DroneProtocol.buildFpvMiniPair implementation required by PotensicProtocol."
            exit 1
          }
          grep -q "fun buildFpvMiniPair" app/src/main/java/com/potensic/proxy/protocol/PotensicProtocol.kt || {
            echo "::error file=app/src/main/java/com/potensic/proxy/protocol/PotensicProtocol.kt::Missing PotensicProtocol.buildFpvMiniPair forwarding method."
            exit 1
          }

      - name: Install WebUI dependencies
        working-directory: webui
        run: npm ci --include=optional --no-audit --no-fund

      - name: Verify Linux Rollup native dependency
        working-directory: webui
        shell: bash
        run: |
          node -e "const path = require.resolve('@rollup/rollup-linux-x64-gnu'); console.log('[rollup-native] OK: '+path)"
          node -e "console.log('[rollup] version='+require('rollup/package.json').version)"

      - name: Verify source versions and build prerequisites
        working-directory: webui
        run: npm run verify:source

      - name: Check npm dependency security (non-blocking)
        working-directory: webui
        shell: bash
        run: |
          npm audit --json > npm-audit-report.json || echo "::warning::npm audit reported vulnerabilities; review the uploaded report."

      - name: Upload npm security audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-${{ github.sha }}
          path: webui/npm-audit-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Prepare stable debug signing (required for in-app updates)
        shell: bash
        env:
          TAF_DEBUG_KEYSTORE_B64: ${{ secrets.TAF_DEBUG_KEYSTORE_B64 }}
          TAF_DEBUG_STORE_PASSWORD: ${{ secrets.TAF_DEBUG_STORE_PASSWORD }}
          TAF_DEBUG_KEY_ALIAS: ${{ secrets.TAF_DEBUG_KEY_ALIAS }}
          TAF_DEBUG_KEY_PASSWORD: ${{ secrets.TAF_DEBUG_KEY_PASSWORD }}
        run: |
          test -n "$TAF_DEBUG_KEYSTORE_B64" || { echo "::error::Stable debug signing secret TAF_DEBUG_KEYSTORE_B64 is missing."; exit 1; }
          test -n "$TAF_DEBUG_STORE_PASSWORD" && test -n "$TAF_DEBUG_KEY_ALIAS" && test -n "$TAF_DEBUG_KEY_PASSWORD" || { echo "::error::Debug signing passwords/alias missing."; exit 1; }
          echo "$TAF_DEBUG_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/taf-debug.keystore"
          echo "TAF_DEBUG_KEYSTORE=$RUNNER_TEMP/taf-debug.keystore" >> "$GITHUB_ENV"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Android debug APK (includes one WebUI build and verification)
        env:
          TAF_BUILD_VERSION_CODE: ${{ github.run_number }}
          TAF_DEBUG_STORE_PASSWORD: ${{ secrets.TAF_DEBUG_STORE_PASSWORD }}
          TAF_DEBUG_KEY_ALIAS: ${{ secrets.TAF_DEBUG_KEY_ALIAS }}
          TAF_DEBUG_KEY_PASSWORD: ${{ secrets.TAF_DEBUG_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Prepare commit-specific APK name
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          cp app/build/outputs/apk/debug/app-debug.apk "PotensicProxy_TAF-${SHORT_SHA}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PotensicProxy_TAF-${{ github.sha }}
          path: PotensicProxy_TAF-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish BL_ update as GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          APK=$(find . -maxdepth 1 -name 'PotensicProxy_TAF-*.apk' -print -quit)
          test -n "$APK"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          TAG="debug-bl-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          APK_NAME="PotensicProxy_TAF-debug-${VERSION_CODE}.apk"
          cp "$APK" "$APK_NAME"
          python3 - "$APK_NAME" "$SHA" "$VERSION_CODE" "$TAG" <<'PYMANIFEST'
          import json,sys,os
          name,digest,version,tag=sys.argv[1:]
          manifest={"channel":"debug","packageName":"com.potensic.proxy", "versionCode":int(version), "versionName":"0.9845.7", "sha256":digest,"apkUrl":f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/{name}"}
          open('taf-update-manifest.json','w').write(json.dumps(manifest,indent=2)+'\n')
          PYMANIFEST
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          gh release create "$TAG" "$APK_NAME" "$APK_NAME.sha256" taf-update-manifest.json --prerelease --title "PotensicProxy BL_ debug $VERSION_CODE" --notes "BL_ debug build ${GITHUB_SHA::7}. In-place updates require the same stable debug signing key as the installed app."
