name: Build PotensicProxy TAF APK

on:
  push:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build uncached debug APK for BL_ or BA_ commit
    if: ${{ startsWith(github.event.head_commit.message, 'BL_') || startsWith(github.event.head_commit.message, 'BA_') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reject unresolved Git merge markers
        shell: bash
        run: |
          set -euo pipefail
          files=(app/build.gradle.kts settings.gradle.kts build.gradle.kts gradle.properties)
          files+=(.github/workflows/*.yml .github/workflows/*.yaml)
          failed=0
          for file in "${files[@]}"; do
            [[ -f "$file" ]] || continue
            if grep -nE '^(<<<<<<< |======= *$|>>>>>>> )' "$file"; then
              echo "::error file=$file::Unresolved Git merge conflict; resolve and commit before building."
              failed=1
            fi
          done
          exit "$failed"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Require stable debug signing credentials for BA_
        if: ${{ startsWith(github.event.head_commit.message, 'BA_') }}
        shell: bash
        env:
          TAF_DEBUG_KEYSTORE_B64: ${{ secrets.TAF_DEBUG_KEYSTORE_B64 }}
          TAF_DEBUG_STORE_PASSWORD: ${{ secrets.TAF_DEBUG_STORE_PASSWORD }}
          TAF_DEBUG_KEY_ALIAS: ${{ secrets.TAF_DEBUG_KEY_ALIAS }}
          TAF_DEBUG_KEY_PASSWORD: ${{ secrets.TAF_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in TAF_DEBUG_KEYSTORE_B64 TAF_DEBUG_STORE_PASSWORD TAF_DEBUG_KEY_ALIAS TAF_DEBUG_KEY_PASSWORD; do
            test -n "${!key}" || { echo "::error::Missing mandatory BA signing secret: $key"; exit 1; }
            echo "::add-mask::${!key}"
          done
          printf '%s' "$TAF_DEBUG_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/taf-debug.keystore"
          test -s "$RUNNER_TEMP/taf-debug.keystore"
          keytool -list -v -keystore "$RUNNER_TEMP/taf-debug.keystore" \
            -storepass "$TAF_DEBUG_STORE_PASSWORD" -alias "$TAF_DEBUG_KEY_ALIAS" \
            > "$RUNNER_TEMP/ba-keystore-identity.txt"
          grep -qi '60:0F:D0:95:F4:77:BC:F5:82:A2:A8:28:EF:C4:D0:F4:CF:D7:F8:D6:41:85:82:92:C4:77:63:5A:10:77:32:62' "$RUNNER_TEMP/ba-keystore-identity.txt" || {
            echo "::error::BA keystore certificate does not match the approved fingerprint"; exit 1;
          }
          echo "TAF_DEBUG_KEYSTORE=$RUNNER_TEMP/taf-debug.keystore" >> "$GITHUB_ENV"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'

      - name: Verify required map WebUI sources
        shell: bash
        run: |
          required=(
            webui/src/components/cockpit/MapView.vue
            webui/src/components/settings/MapSettingsView.vue
            webui/src/composables/useCockpitViewSettings.ts
            webui/src/services/MapService.ts
            webui/src/types/map.ts
          )
          missing=0
          for file in "${required[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=$file::Required map integration source file is missing from the commit/package."
              missing=1
            fi
          done
          exit "$missing"

      - name: Verify MiniPair protocol source completeness
        shell: bash
        run: |
          grep -q "fun buildFpvMiniPair" app/src/main/java/com/potensic/proxy/DroneProtocol.kt || {
            echo "::error file=app/src/main/java/com/potensic/proxy/DroneProtocol.kt::Missing DroneProtocol.buildFpvMiniPair implementation required by PotensicProtocol."
            exit 1
          }
          grep -q "fun buildFpvMiniPair" app/src/main/java/com/potensic/proxy/protocol/PotensicProtocol.kt || {
            echo "::error file=app/src/main/java/com/potensic/proxy/protocol/PotensicProtocol.kt::Missing PotensicProtocol.buildFpvMiniPair forwarding method."
            exit 1
          }

      - name: Install WebUI dependencies
        working-directory: webui
        run: npm ci --include=optional --no-audit --no-fund

      - name: Verify Linux Rollup native dependency
        working-directory: webui
        shell: bash
        run: |
          node -e "const path = require.resolve('@rollup/rollup-linux-x64-gnu'); console.log('[rollup-native] OK: '+path)"
          node -e "console.log('[rollup] version='+require('rollup/package.json').version)"

      - name: Verify source versions and build prerequisites
        working-directory: webui
        run: npm run verify:source

      - name: Check npm dependency security (non-blocking)
        working-directory: webui
        shell: bash
        run: |
          npm audit --json > npm-audit-report.json || echo "::warning::npm audit reported vulnerabilities; review the uploaded report."

      - name: Upload npm security audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-${{ github.sha }}
          path: webui/npm-audit-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Detect optional stable debug signing for BL_
        if: ${{ startsWith(github.event.head_commit.message, 'BL_') }}
        shell: bash
        env:
          TAF_DEBUG_KEYSTORE_B64: ${{ secrets.TAF_DEBUG_KEYSTORE_B64 }}
          TAF_DEBUG_STORE_PASSWORD: ${{ secrets.TAF_DEBUG_STORE_PASSWORD }}
          TAF_DEBUG_KEY_ALIAS: ${{ secrets.TAF_DEBUG_KEY_ALIAS }}
          TAF_DEBUG_KEY_PASSWORD: ${{ secrets.TAF_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$TAF_DEBUG_KEYSTORE_B64" && -n "$TAF_DEBUG_STORE_PASSWORD" && -n "$TAF_DEBUG_KEY_ALIAS" && -n "$TAF_DEBUG_KEY_PASSWORD" ]]; then
            printf '%s' "$TAF_DEBUG_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/taf-debug.keystore"
            test -s "$RUNNER_TEMP/taf-debug.keystore"
            echo "TAF_DEBUG_KEYSTORE=$RUNNER_TEMP/taf-debug.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No complete stable signing credentials; BL_ will use ordinary debug signing."
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Android debug APK (includes one WebUI build and verification)
        env:
          TAF_BUILD_VERSION_CODE: ${{ github.run_number }}
          TAF_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          TAF_DEBUG_STORE_PASSWORD: ${{ secrets.TAF_DEBUG_STORE_PASSWORD }}
          TAF_DEBUG_KEY_ALIAS: ${{ secrets.TAF_DEBUG_KEY_ALIAS }}
          TAF_DEBUG_KEY_PASSWORD: ${{ secrets.TAF_DEBUG_KEY_PASSWORD }}
        run: |
          if [[ "$TAF_COMMIT_MESSAGE" == BA_* ]]; then
            export TAF_BUILD_VERSION_CODE=$((1900000 + GITHUB_RUN_NUMBER))
          fi
          # Retry only transient repository/network failures. Do not retry compilation errors.
          # A fresh Gradle user home is not required: --no-build-cache remains enforced,
          # while downloaded Maven dependencies may be reused between attempts.
          set -euo pipefail
          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            log="$RUNNER_TEMP/gradle-attempt-${attempt}.log"
            echo "[Gradle] Uncached build attempt ${attempt}/${max_attempts}"
            if ./gradlew --no-build-cache --no-parallel --max-workers=2 :app:assembleDebug --stacktrace 2>&1 | tee "$log"; then
              echo "[Gradle] Build succeeded on attempt ${attempt}."
              exit 0
            fi
            # Only known temporary remote-server HTTP errors warrant another attempt.
            if ! grep -Eqi '(status code (429|502|503|504)|HTTP (429|502|503|504)|Too Many Requests|Read timed out|Connection reset)' "$log"; then
              echo "::error::Gradle failed without a recognized transient download error; not retrying."
              exit 1
            fi
            if [[ "$attempt" -ge "$max_attempts" ]]; then
              echo "::error::Gradle dependency download failed after ${max_attempts} attempts."
              exit 1
            fi
            delay=$((attempt * 45))
            echo "::warning::Temporary dependency download failure; retrying in ${delay}s."
            sleep "$delay"
          done
          exit 1

      - name: Prepare commit-specific APK name
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          cp app/build/outputs/apk/debug/app-debug.apk "PotensicProxy_TAF-${SHORT_SHA}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PotensicProxy_TAF-${{ github.sha }}
          path: PotensicProxy_TAF-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Verify identity, version and signing
        if: ${{ startsWith(github.event.head_commit.message, 'BA_') }}
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/ba-apk-verification.txt"
          grep -q 'Verified using' "$RUNNER_TEMP/ba-apk-verification.txt"
          grep -qi '600fd095f477bcf582a2a828efc4d0f4cfd7f8d641858292c477635a10773262' "$RUNNER_TEMP/ba-apk-verification.txt" || {
            echo "::error::BA APK is signed with an unapproved certificate"; exit 1;
          }
          META=$("$BUILD_TOOLS/aapt" dump badging "$APK" | grep '^package:')
          echo "$META" | grep -q "name='com.potensic.proxy'"
          EXPECTED=$((2000000 + GITHUB_RUN_NUMBER))
          echo "$META" | grep -q "versionCode='$EXPECTED'"
          echo "[BA] package and versionCode verified: $EXPECTED"

      - name: Prepare release payload
        if: ${{ startsWith(github.event.head_commit.message, 'BA_') }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_ba_release.py \
            --apk app/build/outputs/apk/debug/app-debug.apk \
            --output "$RUNNER_TEMP/ba-release" \
            --repository "$GITHUB_REPOSITORY" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --sha "$GITHUB_SHA" \
            --version-name "$(python3 -c 'import json;print(json.load(open("webui/package.json"))["version"])')"

      - name: Upload BA diagnostics
        if: ${{ always() && startsWith(github.event.head_commit.message, 'BA_') }}
        uses: actions/upload-artifact@v4
        with:
          name: BA-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ba-apk-verification.txt
            ${{ runner.temp }}/ba-release/*.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish approved BA prerelease
        if: ${{ startsWith(github.event.head_commit.message, 'BA_') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="ba-debug-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          cd "$RUNNER_TEMP/ba-release"
          gh release create "$TAG" ./*.apk ./*.sha256 taf-update-manifest.json \
            --prerelease --target "$GITHUB_SHA" \
            --title "PotensicProxy BA_ debug ${GITHUB_RUN_NUMBER}" \
            --notes "BA_ automatic debug update from ${GITHUB_SHA::7}; requires the same signing identity as the installed APK."
