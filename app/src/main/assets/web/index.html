<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Potensic Proxy</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#e0e0e0;font-family:'JetBrains Mono',monospace;overflow:hidden;height:100vh}
.top{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:rgba(20,20,40,.9);border-bottom:1px solid #ff1744}
.top h1{font-size:14px;color:#ff1744}
.status{font-size:11px;padding:3px 8px;border-radius:4px}
.status.on{background:rgba(0,255,100,.2);color:#0f6;border:1px solid #0f6}
.status.off{background:rgba(255,23,68,.2);color:#ff1744;border:1px solid #ff1744}
.main{display:flex;height:calc(100vh - 38px)}
.video-area{flex:1;display:flex;flex-direction:column;align-items:center;background:#000;position:relative}
.video-area img{width:100%;height:auto;max-height:60vh;object-fit:contain}
.telemetry-bar{display:flex;gap:12px;padding:6px 12px;background:rgba(0,0,0,.8);font-size:11px;flex-wrap:wrap;justify-content:center}
.tel-item{color:#0f6}.tel-item span{color:#fff}
.controls{display:flex;align-items:center;gap:20px;padding:8px}
.joystick-container{position:relative;width:160px;height:160px}
.joystick-bg{width:160px;height:160px;border-radius:50%;background:rgba(30,30,60,.8);border:2px solid #333}
.joystick-thumb{position:absolute;width:50px;height:50px;border-radius:50%;background:radial-gradient(circle,#ff1744,#b71c1c);border:2px solid #ff4444;top:55px;left:55px;cursor:grab;touch-action:none;box-shadow:0 0 10px rgba(255,23,68,.5)}
.joystick-label{text-align:center;font-size:10px;color:#888;margin-top:2px}
.rc-dot{position:absolute;width:14px;height:14px;border-radius:50%;background:#0f6;opacity:.8;top:73px;left:73px;pointer-events:none;box-shadow:0 0 6px #0f6;z-index:10}
.cmd-buttons{display:flex;flex-direction:column;gap:6px}
.btn{padding:8px 14px;border:1px solid #ff1744;background:rgba(255,23,68,.1);color:#ff1744;border-radius:4px;cursor:pointer;font-size:11px;font-family:inherit}
.btn:hover{background:rgba(255,23,68,.3)}
.btn.green{border-color:#0f6;color:#0f6;background:rgba(0,255,100,.1)}
.btn.green:hover{background:rgba(0,255,100,.3)}
.btn.red{border-color:#f00;color:#f00;background:rgba(255,0,0,.2);font-weight:bold}
.sidebar{width:280px;background:rgba(15,15,30,.95);border-left:1px solid #222;display:flex;flex-direction:column;font-size:10px}
.sidebar h2{font-size:11px;color:#ff1744;padding:6px 8px;border-bottom:1px solid #222}
.logs{flex:1;overflow-y:auto;padding:4px;line-height:1.4}
.logs .l{white-space:pre-wrap;word-break:break-all}
.logs .error{color:#f44}.logs .warn{color:#ffa726}.logs .info{color:#42a5f5}
.fps{position:absolute;top:4px;right:8px;color:#0f0;font-size:11px;text-shadow:0 0 4px #000;font-family:monospace}
</style>
</head>
<body>
<div class="top">
  <h1>POTENSIC PROXY</h1>
  <div id="st" class="status off">DISCONNECTED</div>
</div>
<div class="main">
  <div class="video-area">
    <img id="vid" src="/api/video/mjpeg" onerror="this.style.opacity='0.3'" onload="this.style.opacity='1'">
    <div class="fps" id="fps">-- fps</div>
    <div class="telemetry-bar" id="tel">
      <div class="tel-item">BAT: <span id="tbat">--%</span></div>
      <div class="tel-item">ALT: <span id="talt">--m</span></div>
      <div class="tel-item">SPD: <span id="tspd">--m/s</span></div>
      <div class="tel-item">VSPD: <span id="tvspd">--m/s</span></div>
      <div class="tel-item">DIST: <span id="tdist">--m</span></div>
      <div class="tel-item">SAT: <span id="tsat">--</span></div>
      <div class="tel-item">GPS: <span id="tgps">--</span></div>
      <div class="tel-item">VOLT: <span id="tvolt">--V</span></div>
      <div class="tel-item">HDG: <span id="thdg">--°</span></div>
      <div class="tel-item">PITCH: <span id="tpitch">--°</span></div>
      <div class="tel-item">ROLL: <span id="troll">--°</span></div>
      <div class="tel-item">WIND: <span id="twind">--m/s</span></div>
      <div class="tel-item">RC: <span id="trc">--V</span></div>
      <div class="tel-item">RC-JOY: <span id="trcjoy">--</span></div>
      <div class="tel-item">JOY: <span id="tjoy">0,0,0,0</span></div>
    </div>
    <div class="controls">
      <div>
        <div class="joystick-container" id="leftStick"><div class="joystick-bg"></div><div class="joystick-thumb" id="leftThumb"></div><div class="rc-dot" id="leftRC"></div></div>
        <div class="joystick-label">THROTTLE / YAW</div>
      </div>
      <div class="cmd-buttons">
        <button class="btn green" onclick="cmd('takeoff')">TAKEOFF</button>
        <button class="btn" onclick="cmd('land')">LAND</button>
        <button class="btn" onclick="cmd('rth')">RTH</button>
        <button class="btn" onclick="cmd('photo')">PHOTO</button>
        <button class="btn" onclick="cmd('record')">REC</button>
        <button class="btn red" onclick="cmd('emergency')">STOP</button>
        <button class="btn" onclick="testJoy()">TEST JOY</button>
      </div>
      <div>
        <div class="joystick-container" id="rightStick"><div class="joystick-bg"></div><div class="joystick-thumb" id="rightThumb"></div><div class="rc-dot" id="rightRC"></div></div>
        <div class="joystick-label">PITCH / ROLL</div>
      </div>
    </div>
  </div>
  <div class="sidebar">
    <h2>LOGS</h2>
    <div class="logs" id="logs"></div>
  </div>
</div>
<script>
let ws=null,logIdx=0;
const sticks={left:{x:0,y:0},right:{x:0,y:0}};

function connectWS(){
  const p=location.protocol==='https:'?'wss:':'ws:';
  ws=new WebSocket(`${p}//${location.host}/ws/control`);
  ws.onopen=()=>log('INFO','WS connected');
  ws.onclose=()=>{log('WARN','WS disconnected');setTimeout(connectWS,2000)};
  ws.onmessage=e=>{
    try{
      const d=JSON.parse(e.data);
      if(d.type==='telemetry'&&d.data){
        const t=d.data;
        document.getElementById('tbat').textContent=t.battery+'%';
        document.getElementById('talt').textContent=t.altitude.toFixed(1)+'m';
        document.getElementById('tspd').textContent=t.horizontalSpeed.toFixed(1)+'m/s';
        document.getElementById('tvspd').textContent=t.verticalSpeed.toFixed(1)+'m/s';
        document.getElementById('tdist').textContent=t.horizontalDistance.toFixed(1)+'m';
        document.getElementById('tsat').textContent=t.satellites;
        if(t.latitude!==0||t.longitude!==0)document.getElementById('tgps').textContent=t.latitude.toFixed(6)+','+t.longitude.toFixed(6);
        document.getElementById('tvolt').textContent=t.flightVoltage.toFixed(1)+'V';
        document.getElementById('thdg').textContent=t.heading+'°';
        document.getElementById('tpitch').textContent=t.pitch+'°';
        document.getElementById('troll').textContent=t.roll+'°';
        document.getElementById('twind').textContent=t.windSpeed.toFixed(1)+'m/s';
        if(t.remoterBatteryVoltage>0)document.getElementById('trc').textContent=t.remoterBatteryVoltage.toFixed(1)+'V';
        document.getElementById('trcjoy').textContent=t.rcThrottle+','+t.rcYaw+','+t.rcPitch+','+t.rcRoll;
        // Move RC dots to reflect physical controller positions
        updateRCDot('leftRC',t.rcYaw,t.rcThrottle);
        updateRCDot('rightRC',t.rcRoll,t.rcPitch);
      }
    }catch(_){}
  };
}

function setupJoystick(cid,tid,side){
  const c=document.getElementById(cid),t=document.getElementById(tid);
  let active=false;const cn=80,r=55,tr=25;
  function upd(cx,cy){
    const rect=c.getBoundingClientRect();
    let dx=cx-rect.left-cn,dy=cy-rect.top-cn;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist>r){dx=dx/dist*r;dy=dy/dist*r}
    t.style.left=(cn+dx-tr)+'px';t.style.top=(cn+dy-tr)+'px';
    sticks[side].x=Math.round(dx/r*1000);sticks[side].y=Math.round(-dy/r*1000);
    send();
  }
  function rst(){active=false;t.style.left=(cn-tr)+'px';t.style.top=(cn-tr)+'px';sticks[side]={x:0,y:0};send()}
  t.addEventListener('touchstart',e=>{active=true;e.preventDefault()});
  document.addEventListener('touchmove',e=>{if(active){upd(e.touches[0].clientX,e.touches[0].clientY);e.preventDefault()}},{passive:false});
  document.addEventListener('touchend',()=>{if(active)rst()});
  t.addEventListener('mousedown',e=>{active=true;e.preventDefault()});
  document.addEventListener('mousemove',e=>{if(active)upd(e.clientX,e.clientY)});
  document.addEventListener('mouseup',()=>{if(active)rst()});
}

let lastSend=0;
function send(){
  const now=Date.now();if(now-lastSend<20)return;lastSend=now;
  const j={throttle:sticks.left.y,yaw:sticks.left.x,pitch:sticks.right.y,roll:sticks.right.x,gimbal:0};
  document.getElementById('tjoy').textContent=`${j.throttle},${j.yaw},${j.pitch},${j.roll}`;
  fetch(`/api/test/joy?t=${j.throttle}&y=${j.yaw}&p=${j.pitch}&r=${j.roll}`).catch(()=>{});
}

// Move RC indicator dot to reflect physical controller stick position
function updateRCDot(dotId,x,y){
  const d=document.getElementById(dotId);
  if(!d)return;
  const cn=80,r=55,dr=7;
  const dx=Math.max(-r,Math.min(r,(x/1000)*r));
  const dy=Math.max(-r,Math.min(r,(y/1000)*r));
  d.style.left=(cn+dx-dr)+'px';
  d.style.top=(cn+dy-dr)+'px';
}

function testJoy(){
  fetch('/api/test/joy?r=500').then(r=>r.json()).then(d=>{
    log('INFO','TEST JOY sent: roll=500');
    setTimeout(()=>fetch('/api/test/joy?r=0').then(()=>log('INFO','TEST JOY reset')),1000);
  }).catch(e=>log('ERROR','TEST JOY failed: '+e));
}

function cmd(c){fetch('/api/cmd/'+c,{method:'POST'}).then(r=>r.json()).then(d=>log('INFO','CMD: '+JSON.stringify(d)))}

function log(lv,msg){
  const el=document.getElementById('logs'),d=document.createElement('div');
  d.className='l '+(lv==='ERROR'?'error':lv==='WARN'?'warn':'info');
  d.textContent='['+new Date().toLocaleTimeString()+'] '+msg;
  el.appendChild(d);el.scrollTop=el.scrollHeight;
}

function pollStatus(){
  fetch('/api/status').then(r=>r.json()).then(d=>{
    const el=document.getElementById('st');
    el.className='status '+(d.connected?'on':'off');
    el.textContent=d.connected?'CONNECTED':'DISCONNECTED';
  }).catch(()=>{});
}

setupJoystick('leftStick','leftThumb','left');
setupJoystick('rightStick','rightThumb','right');
connectWS();
setInterval(pollStatus,3000);
log('INFO','Potensic Proxy loaded');
</script>
</body>
</html>
